<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Chiku's Magical Market</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#viewer {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#top {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
}

.badge {
    background: rgba(255,255,255,.94);
    padding: 10px 15px;
    border-radius: 22px;
    font-weight: bold;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
}

#counter {
    background: #ffd43b;
    color: #503900;
}

#message {
    position: fixed;
    left: 50%;
    bottom: 65px;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(0,0,0,.75);
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    text-align: center;
    font-size: 14px;
    white-space: nowrap;
}

#chiku {
    position: fixed;
    left: 12px;
    bottom: 15px;
    z-index: 15;
    background: white;
    border-radius: 18px;
    padding: 10px 14px;
    width: 240px;
    box-shadow: 0 4px 15px rgba(0,0,0,.3);
    font-size: 14px;
}

#chiku b {
    color: #ed7b20;
}

.hotspot {
    position: fixed;
    z-index: 20;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 4px solid white;
    background: #ffd43b;
    box-shadow: 0 0 0 6px rgba(255,212,59,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    cursor: pointer;
    user-select: none;
}

#complete {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.72);
    align-items: center;
    justify-content: center;
}

.card {
    background: white;
    width: 85%;
    max-width: 380px;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
}

.card h1 {
    color: #ed7b20;
}

.card button {
    border: 0;
    background: #ed7b20;
    color: white;
    padding: 13px 25px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="viewer"></div>

<div id="top">
    <div class="badge">🐰 Chiku's Magical Market</div>
    <div class="badge" id="counter">Found: 0 / 4</div>
</div>

<div id="chiku">
    <b>Chiku 🐰</b><br>
    Swipe around and find the hidden objects!
</div>

<div id="message">
    👆 Swipe left or right to explore the market
</div>

<div id="complete">
    <div class="card">
        <h1>🎉 Amazing!</h1>
        <p>You found all the hidden objects!</p>
        <p>🌟 Mission Complete 🌟</p>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.getElementById("viewer")
    .appendChild(renderer.domElement);


/* =========================
   LOAD 360 MARKET IMAGE
========================= */

const loader = new THREE.TextureLoader();

loader.load(
    "market360.png",

    function(texture) {

        texture.colorSpace = THREE.SRGBColorSpace;

        const geometry =
            new THREE.SphereGeometry(
                50,
                64,
                40
            );

        /* Camera is inside the sphere */
        geometry.scale(-1, 1, 1);

        const material =
            new THREE.MeshBasicMaterial({
                map: texture
            });

        const panorama =
            new THREE.Mesh(
                geometry,
                material
            );

        scene.add(panorama);

        createHotspots();

        animate();
    },

    undefined,

    function() {

        document.getElementById("chiku").innerHTML =
            "<b>Chiku 🐰</b><br>" +
            "I can't find market360.png. Please check the image filename.";
    }
);


/* =========================
   CAMERA ROTATION
========================= */

let dragging = false;

let previousX = 0;
let previousY = 0;

let yaw = 0;
let pitch = 0;

let targetYaw = 0;
let targetPitch = 0;

renderer.domElement.addEventListener(
    "pointerdown",
    function(e) {

        dragging = true;

        previousX = e.clientX;
        previousY = e.clientY;
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging) return;

        const dx =
            e.clientX - previousX;

        const dy =
            e.clientY - previousY;

        targetYaw -= dx * 0.003;

        targetPitch -= dy * 0.003;

        targetPitch =
            Math.max(
                -1.4,
                Math.min(1.4, targetPitch)
            );

        previousX = e.clientX;
        previousY = e.clientY;
    }
);

window.addEventListener(
    "pointerup",
    function() {
        dragging = false;
    }
);


/* =========================
   HIDDEN OBJECTS
========================= */

const objects = [

    {
        name: "Apple",
        emoji: "🍎",
        message: "Great! You found the apple!",
        position: new THREE.Vector3(8, 2, -30)
    },

    {
        name: "Banana",
        emoji: "🍌",
        message: "Wonderful! You found the banana!",
        position: new THREE.Vector3(-12, 0, -28)
    },

    {
        name: "Mango",
        emoji: "🥭",
        message: "Amazing! You found the mango!",
        position: new THREE.Vector3(25, 3, -18)
    },

    {
        name: "Flowers",
        emoji: "🌸",
        message: "Beautiful! You found the flowers!",
        position: new THREE.Vector3(-25, 2, -15)
    }

];

let found = 0;


/* =========================
   CREATE HOTSPOTS
========================= */

function createHotspots() {

    objects.forEach(function(item) {

        const hotspot =
            document.createElement("div");

        hotspot.className = "hotspot";

        hotspot.innerHTML = item.emoji;

        document.body.appendChild(hotspot);

        item.element = hotspot;

        hotspot.addEventListener(
            "pointerdown",
            function(e) {

                e.stopPropagation();

                if (item.found) return;

                item.found = true;

                found++;

                hotspot.style.display = "none";

                document.getElementById(
                    "counter"
                ).innerText =
                    "Found: " + found + " / 4";

                document.getElementById(
                    "chiku"
                ).innerHTML =
                    "<b>Chiku 🐰</b><br>" +
                    item.message;

                if (found === 4) {

                    setTimeout(
                        function() {

                            document.getElementById(
                                "complete"
                            ).style.display = "flex";

                        },
                        600
                    );
                }

            }
        );
    });
}


/* =========================
   POSITION HOTSPOTS
========================= */

function updateHotspots() {

    objects.forEach(function(item) {

        if (!item.element || item.found)
            return;

        const position =
            item.position.clone();

        position.project(camera);

        const x =
            (position.x * .5 + .5) *
            window.innerWidth;

        const y =
            (-position.y * .5 + .5) *
            window.innerHeight;

        /*
        Hide objects that are behind
        the camera.
        */

        if (position.z > 1) {

            item.element.style.display =
                "none";

        } else {

            item.element.style.display =
                "flex";

            item.element.style.left =
                (x - 26) + "px";

            item.element.style.top =
                (y - 26) + "px";
        }

    });
}


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(animate);

    yaw +=
        (targetYaw - yaw) * .12;

    pitch +=
        (targetPitch - pitch) * .12;

    camera.rotation.order = "YXZ";

    camera.rotation.y = yaw;

    camera.rotation.x = pitch;

    updateHotspots();

    renderer.render(
        scene,
        camera
    );
}


/* =========================
   SCREEN RESIZE
========================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
