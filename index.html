<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Chiku's Magical Market</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#viewer {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.header {
  position: fixed;
  top: 18px;
  left: 20px;
  right: 20px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.title {
  background: white;
  padding: 16px 24px;
  border-radius: 30px;
  font-size: 22px;
  font-weight: bold;
}

.score {
  background: #ffd43b;
  padding: 16px 24px;
  border-radius: 30px;
  font-size: 22px;
  font-weight: bold;
}

.message {
  position: fixed;
  left: 22px;
  bottom: 28px;
  z-index: 10;
  background: white;
  padding: 16px 22px;
  border-radius: 22px;
  max-width: 430px;
  font-size: 18px;
  line-height: 1.4;
}

.message strong {
  color: #e67e22;
  font-size: 20px;
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.error {
  color: #c0392b;
  text-align: center;
  padding: 30px;
  max-width: 500px;
}
</style>
</head>

<body>

<div id="viewer"></div>

<div class="loading" id="loading">
  Loading Chiku's Magical Market...
</div>

<div class="header">
  <div class="title">🐰 Chiku's Magical Market</div>
  <div class="score">Found: <span id="score">0</span> / 4</div>
</div>

<div class="message">
  <strong>Chiku 🐰</strong><br>
  Swipe around and find the hidden objects!
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1100
);

camera.position.set(0, 0, 0.1);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

document.getElementById("viewer").appendChild(renderer.domElement);


/* 360 MARKET IMAGE */

const loader = new THREE.TextureLoader();

loader.load(
  "market360.png",

  function(texture) {

    texture.colorSpace = THREE.SRGBColorSpace;

    const geometry = new THREE.SphereGeometry(
      100,
      64,
      40
    );

    /* Turn sphere inside-out */
    geometry.scale(-1, 1, 1);

    const material = new THREE.MeshBasicMaterial({
      map: texture
    });

    const sphere = new THREE.Mesh(
      geometry,
      material
    );

    scene.add(sphere);

    document.getElementById("loading").style.display = "none";

    animate();
  },

  undefined,

  function(error) {

    document.getElementById("loading").innerHTML =
      '<div class="error">' +
      '<h2>Oops! 🐰</h2>' +
      '<p>I cannot find <b>market360.png</b>.</p>' +
      '<p>Please make sure the image is uploaded in the same GitHub folder as index.html.</p>' +
      '</div>';

    console.error(error);
  }
);


/* TOUCH / MOUSE CONTROL */

let isDragging = false;

let startX = 0;
let startY = 0;

let rotationY = 0;
let rotationX = 0;

let startRotationY = 0;
let startRotationX = 0;


renderer.domElement.addEventListener(
  "pointerdown",
  function(event) {

    isDragging = true;

    startX = event.clientX;
    startY = event.clientY;

    startRotationY = rotationY;
    startRotationX = rotationX;

    renderer.domElement.setPointerCapture(event.pointerId);
  }
);


renderer.domElement.addEventListener(
  "pointermove",
  function(event) {

    if (!isDragging) return;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    rotationY =
      startRotationY + dx * 0.005;

    rotationX =
      startRotationX + dy * 0.003;

    rotationX = Math.max(
      -Math.PI / 2,
      Math.min(Math.PI / 2, rotationX)
    );
  }
);


renderer.domElement.addEventListener(
  "pointerup",
  function() {

    isDragging = false;

  }
);


renderer.domElement.addEventListener(
  "pointercancel",
  function() {

    isDragging = false;

  }
);


/* RESIZE */

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);


/* ANIMATION */

function animate() {

  requestAnimationFrame(animate);

  camera.rotation.order = "YXZ";

  camera.rotation.y = rotationY;

  camera.rotation.x = rotationX;

  renderer.render(
    scene,
    camera
  );
}

</script>

</body>
</html>
